<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de builds</title>
<meta name="description" content="Garde tes tutoriels de builds Minecraft, avec les matériaux à réunir.">
<meta name="theme-color" content="#4E8A32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Builds">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
  color-scheme: light dark;
  --grass: #4E8A32;
  --grass-hi: #6DB04A;
  --dirt: #8B5E3C;
  --dirt-dk: #6E4A2E;
  --gold: #E3A62B;
  --red: #C8352B;
  --sky: #2F9CAB;
  --bg: #E6E9DE;
  --surface: #F8F9F4;
  --sunken: #DCE0D2;
  --ink: #1F2D21;
  --soft: #596757;
  --line: #243326;
  --on-accent: #ffffff;
  --ok: #4E8A32;
  --err: #C8352B;
  --radius: 16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161C17;
    --surface: #212A22;
    --sunken: #1B221C;
    --ink: #EDF2E8;
    --soft: #A3B1A0;
    --line: #080B09;
    --grass: #5A9A3C;
    --dirt: #A4714A;
    --ok: #5A9A3C;
    --err: #FF8A80;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0;
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
body.lock { overflow: hidden; }
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: var(--wallpaper, none); background-size: var(--wallsize, auto); background-repeat: repeat;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
svg { display: block; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

/* ---------- Bouton "bloc" ---------- */
.blk {
  background: var(--grass);
  color: var(--on-accent);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 4px 0 var(--line);
  padding: 11px 16px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform .06s, box-shadow .06s;
}
.blk:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.blk.ghost { background: var(--surface); color: var(--ink); }
.blk.red { background: var(--red); }
.blk.sm { padding: 7px 14px; font-size: 14px; box-shadow: 0 3px 0 var(--line); border-radius: 14px; }
.iconbtn {
  width: 44px; height: 44px; flex-shrink: 0;
  display: grid; place-items: center;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 50%;
  box-shadow: 0 3px 0 var(--line);
  position: relative;
}
.iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.iconbtn svg { width: 22px; height: 22px; }
.badge {
  position: absolute; top: -8px; right: -8px;
  min-width: 20px; height: 20px; padding: 0 5px;
  background: var(--gold); color: #1F2D21;
  border: 2px solid var(--line); border-radius: 10px;
  font-size: 12px; font-weight: 800; display: grid; place-items: center;
}

/* ---------- En-tête ---------- */
.top {
  background: var(--grass);
  padding: calc(14px + var(--safe-t)) 16px 20px;
  position: relative;
  color: #fff;
  border-radius: 0 0 30px 30px;
  border-bottom: 7px solid var(--dirt);
  box-shadow: 0 3px 0 var(--line);
}
.top-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.logo { width: 44px; height: 44px; border: 2px solid var(--line); border-radius: 14px; image-rendering: pixelated; flex-shrink: 0; background: var(--dirt); }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-size: 20px; font-weight: 900; letter-spacing: -0.01em; line-height: 1.1; }
.brand p { font-size: 13px; opacity: .92; margin-top: 2px; }
.top .iconbtn { color: var(--ink); }

.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

/* ---------- Recherche et onglets ---------- */
.searchrow { display: flex; gap: 10px; margin-top: 20px; }
.search {
  flex: 1; display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 999px;
  padding: 0 12px; height: 44px;
  box-shadow: inset 0 2px 0 rgba(0,0,0,.08);
}
.search svg { width: 20px; height: 20px; color: var(--soft); flex-shrink: 0; }
.search input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
  font: inherit; font-size: 16px; outline: none; height: 100%;
}
.search:focus-within { outline: 3px solid var(--sky); outline-offset: 2px; }
.search input::-webkit-search-cancel-button { display: none; }

.tabs {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  margin-top: 14px; padding: 4px;
  background: var(--sunken); border: 2px solid var(--line); border-radius: 22px;
}
.tab {
  border: 0; background: transparent; padding: 8px 2px; border-radius: 16px;
  font-weight: 700; font-size: 13px; color: var(--soft);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.tab b { font-size: 17px; color: var(--ink); line-height: 1.1; }
.tab[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 2px 0 var(--line); outline: 2px solid var(--line); }

.active-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.active-chips:empty { display: none; }
.fchip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 999px;
  padding: 4px 6px 4px 12px; font-weight: 700; font-size: 14px;
}
.fchip span.x { width: 22px; height: 22px; display: grid; place-items: center; background: var(--sunken); border-radius: 50%; }
.fchip svg { width: 12px; height: 12px; }

/* ---------- Carte de build ---------- */
.list { margin-top: 16px; padding-bottom: calc(120px + var(--safe-b)); }
.card {
  display: flex; gap: 12px; width: 100%; text-align: left;
  background: var(--surface); color: var(--ink);
  border: 2px solid var(--line); border-radius: 22px;
  box-shadow: 0 4px 0 var(--line);
  padding: 10px; margin-bottom: 14px;
  transition: transform .06s, box-shadow .06s;
}
.card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.thumb {
  width: 92px; height: 92px; flex-shrink: 0; position: relative; overflow: hidden;
  border: 2px solid var(--line); border-radius: 16px;
  background: var(--dirt); color: #fff;
  display: grid; place-items: center; font-weight: 900; font-size: 34px;
}
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.plat {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.62); color: #fff; font-size: 11px; font-weight: 700;
  text-align: center; padding: 2px 0;
}
.cbody { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cbody h3 {
  font-size: 16px; line-height: 1.25; font-weight: 800;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
.tag {
  --c: var(--grass);
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 800; line-height: 1.2;
  padding: 3px 8px; border-radius: 999px;
  border: 2px solid var(--c);
  background: color-mix(in srgb, var(--c) 18%, transparent);
  color: var(--ink);
}
.tag.solid { background: var(--c); color: #fff; }
.diff { display: inline-flex; gap: 3px; align-items: center; }
.diff i { width: 10px; height: 10px; border: 2px solid var(--line); background: transparent; display: block; border-radius: 50%; }
.diff i.on { background: var(--gold); }
.cmeta { margin-top: auto; padding-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--soft); font-weight: 600; }
.bar { flex: 1; height: 10px; background: var(--sunken); border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--grass-hi); width: 0; transition: width .25s; }
.bar.big { height: 14px; margin: 8px 0 12px; }

/* ---------- États vides ---------- */
.empty {
  background: var(--surface); border: 2px dashed var(--line); border-radius: 26px;
  padding: 24px 18px; text-align: center;
}
.empty h2 { font-size: 20px; font-weight: 900; margin-bottom: 6px; }
.empty p { color: var(--soft); }
.steps { list-style: none; padding: 0; margin: 18px 0 20px; text-align: left; display: grid; gap: 10px; }
.steps li { display: flex; gap: 12px; align-items: center; font-weight: 600; }
.steps .n {
  width: 32px; height: 32px; flex-shrink: 0; display: grid; place-items: center;
  background: var(--gold); color: #1F2D21; border: 2px solid var(--line); border-radius: 12px; font-weight: 900;
}
.banner {
  display: flex; align-items: center; gap: 12px; margin-top: 16px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 10px 10px 10px 12px;
}
.banner p { flex: 1; font-size: 14px; font-weight: 600; }
.banner .x { background: none; border: 0; padding: 8px; color: var(--soft); }
.banner .x svg { width: 16px; height: 16px; }

/* ---------- Bouton flottant ---------- */
.fab { position: fixed; right: 16px; bottom: calc(18px + var(--safe-b)); z-index: 5; padding: 14px 20px; font-size: 17px; }
.fab svg { width: 20px; height: 20px; }

/* ---------- Pages plein écran ---------- */
.page {
  position: fixed; inset: 0; z-index: 20; background-color: var(--bg);
  background-image: var(--wallpaper, none); background-size: var(--wallsize, auto); background-repeat: repeat;
  display: none; flex-direction: column;
}
.page.open { display: flex; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.pagebar {
  display: flex; align-items: center; gap: 10px;
  padding: calc(10px + var(--safe-t)) 14px 10px;
  background: var(--surface); border-bottom: 2px solid var(--line); border-radius: 0 0 24px 24px;
}
.pagetitle { flex: 1; min-width: 0; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pagescroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pagebody { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(40px + var(--safe-b)); }
.pagebody.withbar { padding-bottom: calc(110px + var(--safe-b)); }

.video { aspect-ratio: 16 / 9; border: 2px solid var(--line); border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 4px 0 var(--line); }
.video iframe { width: 100%; height: 100%; border: 0; display: block; }
.videocard {
  display: flex; align-items: center; gap: 14px; text-decoration: none; color: #fff;
  background: var(--grass); border: 2px solid var(--line); border-radius: 22px; box-shadow: 0 4px 0 var(--line);
  padding: 16px; position: relative; overflow: hidden; min-height: 96px;
}
.videocard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
.videocard .play, .videocard .vt { position: relative; }
.videocard .play { width: 52px; height: 52px; border-radius: 50%; background: var(--red); border: 2px solid var(--line); display: grid; place-items: center; flex-shrink: 0; }
.videocard .play svg { width: 24px; height: 24px; margin-left: 3px; }
.videocard .vt { font-weight: 900; font-size: 17px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.videocard .vt small { display: block; font-weight: 600; font-size: 13px; opacity: .95; }
.sublink { display: inline-block; margin-top: 10px; color: var(--soft); font-size: 14px; font-weight: 600; }

.dtitle { font-size: 26px; font-weight: 900; line-height: 1.15; margin-top: 20px; letter-spacing: -0.01em; }
.by { color: var(--soft); margin-top: 4px; font-weight: 600; }
.block { margin-top: 24px; }
.block h3 { font-size: 17px; font-weight: 900; }
.rowhead { display: flex; align-items: baseline; justify-content: space-between; }
.rowhead span { color: var(--soft); font-weight: 700; font-size: 14px; }
.seg2 { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin-top: 10px; }
.seg2 button {
  padding: 10px 4px; font-weight: 800; font-size: 14px;
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); box-shadow: 0 3px 0 var(--line);
}
.seg2 button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.seg2 button[aria-pressed="true"] { background: var(--c, var(--grass)); color: #fff; }

#mlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.mrow {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 12px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius);
  min-height: 52px;
}
.mrow .box {
  width: 26px; height: 26px; flex-shrink: 0; display: grid; place-items: center;
  background: var(--bg); border: 2px solid var(--line); border-radius: 9px; color: #fff;
}
.mrow .box svg { width: 18px; height: 18px; }
.mrow.done { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
.mrow.done .box { background: var(--ok); }
.mrow.done .mt { text-decoration: line-through; opacity: .6; }
.qty { flex-shrink: 0; min-width: 38px; text-align: center; background: var(--gold); color: #1F2D21; border: 2px solid var(--line); border-radius: 999px; padding: 1px 6px; font-weight: 900; font-size: 14px; }
.mt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.reset { background: none; border: 0; color: var(--soft); text-decoration: underline; font-weight: 600; padding: 10px 0 0; }
.notes { white-space: pre-wrap; margin-top: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; }
.nomat { color: var(--soft); margin-top: 8px; }

/* ---------- Formulaire ---------- */
.field { margin-top: 20px; }
.field:first-child { margin-top: 0; }
.field > label, .field > .lbl { display: block; font-weight: 800; margin-bottom: 6px; }
.help { color: var(--soft); font-size: 13px; margin-top: 6px; }
.input {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 12px; box-shadow: inset 0 2px 0 rgba(0,0,0,.08);
}
textarea.input { min-height: 140px; resize: vertical; line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  --c: var(--grass);
  padding: 7px 12px; font-weight: 700; font-size: 14px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--c); color: #fff; }
.chip .dot { width: 10px; height: 10px; background: var(--c); border: 2px solid var(--line); display: block; }
.chip[aria-pressed="true"] .dot { background: #fff; }
.err { color: var(--err); font-weight: 800; margin-top: 6px; font-size: 14px; }
.ok { color: var(--grass-hi); font-weight: 700; }
.savebar {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--surface); border-top: 2px solid var(--line); border-radius: 26px 26px 0 0;
  padding: 12px 16px calc(12px + var(--safe-b)); display: flex; gap: 10px;
}
.savebar .blk { flex: 1; }
.danger { background: none; border: 0; color: var(--err); font-weight: 800; padding: 16px 0 0; }

/* ---------- Feuilles du bas ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; display: none; }
.sheet.open { display: block; }
.scrim { position: absolute; inset: 0; background: rgba(8, 12, 9, .55); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.panel {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow-y: auto;
  max-width: 640px; margin: 0 auto;
  background: var(--bg); border: 2px solid var(--line); border-bottom: 0; border-radius: 30px 30px 0 0;
  padding: 10px 16px calc(20px + var(--safe-b)); animation: up .22s ease-out;
}
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--soft); opacity: .5; margin: 0 auto 12px; }
.panel h2 { font-size: 20px; font-weight: 900; margin-bottom: 14px; }
.fgroup { margin-top: 16px; }
.fgroup h3 { font-size: 14px; font-weight: 800; color: var(--soft); margin-bottom: 8px; }
.menurow {
  width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 12px; margin-bottom: 10px;
}
.menurow svg { width: 24px; height: 24px; flex-shrink: 0; color: var(--grass); }
.menurow b { display: block; }
.menurow small { color: var(--soft); font-size: 13px; }
.panel .foot { display: flex; gap: 10px; margin-top: 20px; }
.panel .foot .blk { flex: 1; }
.howto { padding-left: 20px; display: grid; gap: 8px; margin: 0 0 8px; }

/* ---------- Message temporaire ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + var(--safe-b)); z-index: 60;
  background: var(--ink); color: var(--bg); border-radius: 20px; padding: 10px 14px;
  display: none; align-items: center; gap: 14px; font-weight: 700; max-width: calc(100% - 32px); box-shadow: 0 4px 0 var(--line);
}
.toast.show { display: flex; animation: fade .15s; }
.toast button { background: none; border: 0; color: var(--gold); font-weight: 900; padding: 4px; text-decoration: underline; }

details.ctx { margin-top: 10px; }
details.ctx summary { cursor: pointer; font-weight: 700; color: var(--soft); font-size: 14px; padding: 4px 0; }
.warn { background: color-mix(in srgb, var(--gold) 22%, var(--surface)); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
.bi { width: 28px; height: 28px; flex-shrink: 0; display: block; image-rendering: pixelated; filter: drop-shadow(0 1.5px 0 rgba(0,0,0,.35)); }
.bic { display: grid; place-items: center; width: 34px; height: 34px; flex-shrink: 0; background: var(--sunken); border-radius: 12px; }
.mini { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.mini .bi { width: 20px; height: 20px; filter: none; }
.mini .more { font-size: 12px; font-weight: 800; color: var(--soft); margin-left: 2px; }
.blocks { display: flex; justify-content: center; gap: 10px; margin: 0 0 16px; }
.blocks .bi { width: 38px; height: 38px; }
.thumb .emo { font-size: 38px; line-height: 1; }
.tab .tl { white-space: nowrap; }
.top-btns { display: flex; gap: 10px; }
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.theme { text-align: left; padding: 0; background: none; border: 2px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: 0 3px 0 var(--line); position: relative; }
.theme:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.theme[aria-pressed="true"] { outline: 4px solid var(--gold); outline-offset: 2px; }
.theme .tp { height: 78px; position: relative; background-repeat: repeat; }
.theme .tpbar { height: 20px; }
.theme .tpcard { position: absolute; left: 12px; right: 12px; bottom: 9px; height: 22px; border-radius: 11px; border: 2px solid; }
.theme .tn { padding: 8px 10px; font-weight: 800; font-size: 14px; background: var(--surface); color: var(--ink); }
.theme .tn small { display: block; font-weight: 600; color: var(--soft); font-size: 12px; }
.theme .chk { position: absolute; top: 28px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #1F2D21; border: 2px solid var(--line); display: grid; place-items: center; }
.theme .chk svg { width: 14px; height: 14px; }
.fgroup.span { grid-column: 1 / -1; }
.sectitle { grid-column: 1 / -1; font-size: 14px; font-weight: 800; color: var(--soft); margin-top: 6px; }
textarea.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; min-height: 110px; }
.cathead { font-size: 13px; font-weight: 800; color: var(--soft); margin: 14px 0 6px; }
.morebtn { background: none; border: 0; color: var(--soft); text-decoration: underline; font-weight: 700; padding: 12px 0 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <img class="logo" src="icon-192.png" alt="" onerror="this.style.visibility='hidden'">
    <div class="brand">
      <h1>Carnet de builds</h1>
      <p id="subtitle">Tes tutoriels, au même endroit</p>
    </div>
    <div class="top-btns">
      <button class="iconbtn" id="btnTheme" aria-label="Thèmes" type="button"></button>
      <button class="iconbtn" id="btnMenu" aria-label="Menu" type="button"></button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="searchrow">
    <label class="search">
      <span id="icSearch"></span>

  if (/sable des ames/.test(n)) return T.noise(["#5A4636", "#6E5846", "#473529"], r);
  if (/sable/.test(n)) return T.noise(["#DCCB92", "#EADBA6", "#C8B77E"], r);
  if (/terre cuite/.test(n)) return T.noise([P[2], P[0], P[2]], r);
  if (/beton/.test(n)) return T.flat(P);
  if (/laine/.test(n)) return T.noise(P, r);
  if (/gres rouge/.test(n)) return T.noise(["#B5551E", "#C96A2E", "#9A4515"], r);
  const w = woodOf(n);
  if (w) {
    if (/rondin|tronc/.test(n)) return T.log(WOOD[w]);
    if (/barriere/.test(n)) return T.fence(WOOD[w]);
    return shape(T.planks(WOOD[w]), shapeOf(n));
  }
  if (/pierre|roche|cobble|stone/.test(n)) return shape(T.noise(STONE, r), shapeOf(n));
  if (/\bterre\b|\bterre labouree/.test(n)) return T.noise(["#866043", "#9B7452", "#6B4A32"], r);
  const keys = Object.keys(COL);
  return T.noise(col ? P : COL[keys[Math.floor(r() * keys.length)]], r);
}

const BI_CACHE = new Map();
function blockIcon(name) {
  const key = norm(name);
  if (BI_CACHE.has(key)) return BI_CACHE.get(key);
  const g = makeGrid(name);
  let rects = "";
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if (g[y][x]) rects += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${g[y][x]}"/>`;
  const out = `<svg class="bi" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
  BI_CACHE.set(key, out);
  return out;
}

/* ===================== Données ===================== */
let builds = [];
function load() {
  try {
    const r = localStorage.getItem(KEY);
    if (r === null) { builds = sampleBuilds(); persist(); }
    else builds = JSON.parse(r).map(normalize);
  } catch (e) {
    builds = sampleBuilds();
  }
}
function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(builds));
  } catch (e) {
    toast("Sauvegarde impossible sur cet appareil.");
  }
}
const getBuild = (id) => builds.find((b) => b.id === id);
function upsert(b) {
  const i = builds.findIndex((x) => x.id === b.id);
  if (i >= 0) builds[i] = b; else builds.unshift(b);
  persist();
}

/* ===================== Etat de l'écran ===================== */
const st = { q: "", tab: "Tous", f: { theme: "", season: "", difficulty: "", edition: "" } };
const FLABEL = { theme: "Catégorie", season: "Saison", difficulty: "Difficulté", edition: "Édition" };

const knownThemes = () => Array.from(new Set(builds.map((b) => b.theme).filter(Boolean))).sort((a, b) => a.localeCompare(b, "fr"));
const activeFilterCount = () => Object.values(st.f).filter(Boolean).length;

function matches(b, ignoreTab) {
  if (!ignoreTab && st.tab !== "Tous" && b.status !== st.tab) return false;
  if (st.f.theme && b.theme !== st.f.theme) return false;
  if (st.f.season && b.season !== st.f.season) return false;
  if (st.f.difficulty && b.difficulty !== st.f.difficulty) return false;
  if (st.f.edition && b.edition !== st.f.edition && b.edition !== "Les deux") return false;
  const s = st.q.trim().toLowerCase();
  if (s) {
    const hay = [b.title, b.author, b.theme, b.notes, b.season, ...b.materials.map((m) => m.text)].join(" ").toLowerCase();
    if (!hay.includes(s)) return false;
  }
  return true;
}
const filtered = () => builds.filter((b) => matches(b)).sort((a, b) => b.createdAt - a.createdAt);

/* ===================== Rendu de la liste ===================== */
function tagsHTML(b, solid) {
  const out = [];
  if (b.theme) out.push(`<span class="tag" style="--c:var(--grass)">${themeEmoji(b.theme)} ${esc(b.theme)}</span>`);
  if (b.season !== ALL_YEAR) out.push(`<span class="tag" style="--c:${seasonColor(b.season)}">${seasonEmoji(b.season)} ${esc(b.season)}</span>`);
  const lvl = DIFFS.indexOf(b.difficulty) + 1;
  out.push(`<span class="diff" role="img" aria-label="Difficulté : ${esc(b.difficulty)}" title="${esc(b.difficulty)}">${[1, 2, 3].map((i) => `<i class="${i <= lvl ? "on" : ""}"></i>`).join("")}</span>`);
  if (solid) out.push(`<span class="tag" style="--c:var(--line)">${esc(b.edition)}</span>`);
  if (b.sample) out.push(`<span class="tag" style="--c:var(--soft)">Exemple</span>`);
  return out.join("");
}

function thumbHTML(b) {
  const v = parseVideo(b.url);
  const img = v.kind === "youtube" ? `<img src="https://img.youtube.com/vi/${v.id}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">` : "";
  const label = PLATFORM[v.kind];
  const emo = b.season !== ALL_YEAR ? seasonEmoji(b.season) : b.theme ? themeEmoji(b.theme) : "🧱";
  return `<div class="thumb"><span class="emo">${emo}</span>${img}${label ? `<span class="plat">${label}</span>` : ""}</div>`;
}

function cardHTML(b) {
  const done = b.materials.filter((m) => m.done).length;
  const total = b.materials.length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  return `<button type="button" class="card" data-open="${esc(b.id)}">
    ${thumbHTML(b)}
    <div class="cbody">
      <h3>${esc(b.title)}</h3>
      <div class="tags">${tagsHTML(b)}</div>
      ${total ? `<div class="mini" aria-hidden="true">${b.materials.slice(0, 5).map((m) => blockIcon(splitQty(m.text).name)).join("")}${total > 5 ? `<span class="more">+${total - 5}</span>` : ""}</div>` : ""}
      <div class="cmeta">
        ${total ? `<div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div><span>${done}/${total}</span>` : `<span>Matériaux à ajouter</span>`}
        <span class="tag solid" style="--c:${statusColor(b.status)};margin-left:auto">${statusEmoji(b.status)} ${esc(b.status)}</span>
      </div>
    </div>
  </button>`;
}

function renderTabs() {
  const base = builds.filter((b) => matches(b, true));
  const count = (n) => (n === "Tous" ? base.length : base.filter((b) => b.status === n).length);
  const tabs = [{ n: "Tous", label: "Tous", e: "📚" }, ...STATUSES.map((s) => ({ n: s.n, label: s.plural, e: s.e }))];
  $("#tabs").innerHTML = tabs
    .map((t) => `<button type="button" class="tab" data-tab="${esc(t.n)}" aria-pressed="${st.tab === t.n}"><b>${count(t.n)}</b><span class="tl">${t.e} ${esc(t.label)}</span></button>`)
    .join("");
}

function renderChips() {
  $("#activeChips").innerHTML = Object.entries(st.f)
    .filter(([, v]) => v)
    .map(([k, v]) => `<button type="button" class="fchip" data-clear="${k}" aria-label="Retirer le filtre ${esc(v)}">${k === "theme" ? themeEmoji(v) + " " : k === "season" ? seasonEmoji(v) + " " : ""}${esc(v)}<span class="x">${I.x}</span></button>`)
    .join("");

  $("#btnFilters").innerHTML = I.filter + (n ? `<span class="badge">${n}</span>` : "");
}

function renderBanner() {

}

function renderList() {
  const list = filtered();
  const done = builds.filter((b) => b.status === "Terminé").length;
  $("#subtitle").textContent = builds.length
    ? `${builds.length} build${builds.length > 1 ? "s" : ""} · ${done} terminé${done > 1 ? "s" : ""}`

    el.innerHTML = `<div class="empty">

      <p style="margin-top:14px"><button type="button" class="blk ghost sm" data-act="reset-all">Tout afficher</button></p>

    document.body.classList.add("lock");

  pageOpen = false;

/* ---------- Message temporaire ---------- */
let toastTimer = null;
let toastAction = null;
function toast(msg, actionLabel, action) {
  const el = $("#toast");
  toastAction = action || null;
  el.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button type="button" data-act="toast-action">${esc(actionLabel)}</button>` : ""}`;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), actionLabel ? 6000 : 2800);
}
$("#toast").addEventListener("click", (e) => {
  if (e.target.closest("[data-act='toast-action']") && toastAction) {
    toastAction();
    toastAction = null;
    $("#toast").classList.remove("show");
  }
});

function materialsInner(b) {
  if (!b.materials.length) return `<p class="nomat">Aucun matériau noté. Touche le crayon en haut pour en ajouter.</p>`;
  const rows = b.materials.map((m) => {
    const { qty, name } = splitQty(m.text);

      ${qty ? `<span class="qty">${esc(qty)}</span>` : ""}
      <span class="mt">${esc(name)}</span>

  }).join("");

  return `<ul id="mlist">${rows}</ul>${anyDone ? `<button type="button" class="reset" data-act="uncheck-all">Tout décocher</button>` : ""}`;

function refreshMaterials(b) {
  const done = b.materials.filter((m) => m.done).length;
  const total = b.materials.length;
  const bar = $("#mbar");
  if (bar) bar.style.width = (total ? Math.round((done / total) * 100) : 0) + "%";
  const cnt = $("#mcount");
  if (cnt) cnt.textContent = total ? `${done} sur ${total}` : "";
  const wrap = $("#mwrap");
  if (wrap) wrap.innerHTML = materialsInner(b);
}

function wallTile(list, opacity) {

  return `url("data:image/svg+xml,${encodeURIComponent(svgText)}")`;
}

function easterDate(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mo - 1, da);
}
function themeForDate(dt) {
  const md = (dt.getMonth() + 1) * 100 + dt.getDate();
  const day = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
  const easter = easterDate(dt.getFullYear());
  const diff = Math.round((day - easter) / 86400000);
  if (md >= 1015 && md <= 1101) return "halloween";
  if (md >= 1201 && md <= 1226) return "noel";
  if (md >= 1227 || md <= 103) return "nouvelan";
  if (md >= 207 && md <= 214) return "valentin";
  if (diff >= -10 && diff <= 1) return "paques";
  if (md >= 320 && md <= 620) return "printemps";
  if (md >= 621 && md <= 922) return "ete";
  if (md >= 923 && md <= 1130) return "automne";
  return "hiver";
}

const wallCache = {};

  return wallCache[t.id];
}

};
const resolveTheme = (choice) => THEME_BY_ID[choice === "auto" ? themeForDate(new Date()) : choice];

function applyTheme() {
  const root = document.documentElement;
  const t = resolveTheme(getThemeChoice());
  Object.values(VAR_MAP).forEach((k) => root.style.removeProperty(k));
  root.style.removeProperty("--wallpaper");
  root.style.removeProperty("--wallsize");
  root.dataset.theme = t.id;
  let primary = "#4E8A32";
  if (t.v) {
    Object.entries(VAR_MAP).forEach(([k, cssVar]) => root.style.setProperty(cssVar, t.v[k]));
    const w = wallOf(t);
    root.style.setProperty("--wallpaper", w.image);
    root.style.setProperty("--wallsize", w.size);
    root.style.colorScheme = t.dark ? "dark" : "light";
    primary = t.v.grass;
  } else {
    root.style.colorScheme = "light dark";

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", primary);
}

let fetchTimer = null;
let fetchCtl = null;
function onUrlInput() {
  const url = $("#f-url").value.trim();
  const hint = $("#f-hint");
  clearTimeout(fetchTimer);
  if (!url) { hint.textContent = "Le titre se remplit tout seul quand c'est possible."; hint.className = "help"; return; }
  if (!isUrl(url)) { hint.textContent = "Ce lien semble incomplet."; hint.className = "help"; return; }
  const v = parseVideo(url);
  hint.textContent = `Lien ${PLATFORM[v.kind] ? "détecté : " + PLATFORM[v.kind] : "ajouté"}.`;
  hint.className = "help";
  fetchTimer = setTimeout(async () => {
    const t = $("#f-title");
    const a = $("#f-author");
    if (!t || t.value.trim() && t.dataset.auto !== "1") return;
    try {
      if (fetchCtl) fetchCtl.abort();
      fetchCtl = new AbortController();
      const timeout = setTimeout(() => fetchCtl.abort(), 5000);
      const r = await fetch("https://noembed.com/embed?url=" + encodeURIComponent(url), { signal: fetchCtl.signal });
      clearTimeout(timeout);
      const d = await r.json();
      if (!$("#f-title")) return;
      if (d && d.title && (!t.value.trim() || t.dataset.auto === "1")) {
        t.value = d.title;
        t.dataset.auto = "1";
        if (a && !a.value.trim() && d.author_name) a.value = d.author_name;
        hint.innerHTML = `<span class="ok">Titre récupéré automatiquement.</span>`;
      }
    } catch (e) { /* hors ligne ou site non pris en charge : on laisse l'utilisateur saisir */ }
  }, 500);
}

    season: draft.season,
    difficulty: draft.difficulty,
    edition: draft.edition,
    notes: $("#f-notes").value.trim(),
    materials,
  };
  upsert(b);
  toast(prev ? "Modifications enregistrées" : "Build ajouté au carnet");
  showDetail(b.id);
}

function deleteCurrent() {
  const b = getBuild(currentId);
  if (!b) return;
  const idx = builds.findIndex((x) => x.id === b.id);
  builds.splice(idx, 1);
  persist();
  goBack();
  toast("Build supprimé", "Annuler", () => {
    builds.splice(Math.min(idx, builds.length), 0, b);
    persist();
    renderList();
  });
}

/* ===================== Feuilles : filtres, menu, installation ===================== */
function filterSheetInner() {
  const themes = knownThemes();
  const group = (key, title, options, color, icon) => `
    <div class="fgroup"><h3>${title}</h3><div class="chips">
      ${options.map((o) => `<button type="button" class="chip" ${color ? `style="--c:${color(o)}"` : ""} data-act="filter" data-k="${key}" data-v="${esc(o)}" aria-pressed="${st.f[key] === o}">${icon ? icon(o) + " " : ""}${esc(o)}</button>`).join("")}
    </div></div>`;
  return `<h2>Filtrer les builds</h2>
    ${themes.length ? group("theme", "Catégorie", themes, null, themeEmoji) : ""}
    ${group("season", "Saison", SEASONS.map((s) => s.n), seasonColor, seasonEmoji)}
    ${group("difficulty", "Difficulté", DIFFS)}
    ${group("edition", "Édition", EDITIONS.slice(0, 2))}
    <div class="foot">
      <button type="button" class="blk ghost" data-act="clear-filters">Effacer</button>
      <button type="button" class="blk" data-act="close-sheet">Voir ${filtered().length} build${filtered().length > 1 ? "s" : ""}</button>
    </div>`;
}
function openFilters() { openSheet(filterSheetInner()); }
function refreshFilterSheet() {
  const inner = $("#sheetInner");
  if (inner) inner.innerHTML = filterSheetInner();
  renderList();
}

function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; renderBanner(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; renderBanner(); toast("Application installée"); });

function installFlow() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(() => { deferredPrompt = null; renderBanner(); });
    return;
  }
  const steps = isIOS()
    ? `<li>Ouvre cette page dans <b>Safari</b>.</li><li>Touche le bouton <b>Partager</b> (le carré avec une flèche).</li><li>Choisis <b>Sur l'écran d'accueil</b>, puis <b>Ajouter</b>.</li>`
    : `<li>Ouvre le menu de ton navigateur (les trois points).</li><li>Choisis <b>Installer l'application</b> ou <b>Ajouter à l'écran d'accueil</b>.</li>`;
  const inner = `<h2>Installer sur ton téléphone</h2><ol class="howto">${steps}</ol>
    <p class="help">L'application s'ouvrira alors en plein écran, comme les autres, et marchera aussi sans connexion.</p>
    <div class="foot"><button type="button" class="blk" data-act="close-sheet">Compris</button></div>`;
  if (sheetOpen) $("#sheetInner").innerHTML = inner; else openSheet(inner);
}

function openMenu() {
  const t = resolveTheme(getThemeChoice());
  showInSheet(`<h2>Menu</h2>
    <button type="button" class="menurow" data-act="themes"><span style="font-size:24px;width:24px;text-align:center">${t.e}</span><span><b>Thèmes et fonds d'écran</b><small>${getThemeChoice() === "auto" ? "Automatique : " : ""}${esc(t.name)}</small></span></button>
    <button type="button" class="menurow" data-act="install">${I.phone}<span><b>Installer l'application</b><small>L'ajouter à l'écran d'accueil</small></span></button>
    <button type="button" class="menurow" data-act="transfer">${I.down}<span><b>Sauvegarde et transfert</b><small>Garder ou déplacer tes builds</small></span></button>
    ${builds.some((b) => b.sample)
      ? `<button type="button" class="menurow" data-act="remove-samples">${I.x}<span><b>Retirer les exemples</b><small>Garde uniquement tes propres builds</small></span></button>`
      : `<button type="button" class="menurow" data-act="add-samples">${I.plus}<span><b>Ajouter les exemples</b><small>Builds d'automne et d'Halloween</small></span></button>`}`);
}

function backupJSON() {
  return JSON.stringify({ app: "carnet-builds", version: 2, exportedAt: new Date().toISOString(), builds }, null, 2);
}
function openTransfer() {
  showInSheet(`<h2>Sauvegarde et transfert</h2>
    <p class="warn">Pour passer d'une ancienne version à une nouvelle, fais d'abord une sauvegarde dans l'<b>ancienne</b>, puis restaure-la ici. Les builds comptent : <b>${builds.length}</b> sur cet appareil.</p>
    <button type="button" class="menurow" data-act="export">${I.down}<span><b>Télécharger un fichier de sauvegarde</b><small>Un fichier .json à garder</small></span></button>
    <button type="button" class="menurow" data-act="copy-backup">${I.down}<span><b>Copier la sauvegarde</b><small>Du texte à coller dans une autre version</small></span></button>
    <button type="button" class="menurow" data-act="import">${I.up}<span><b>Restaurer depuis un fichier</b><small>Ajoute les builds d'un fichier .json</small></span></button>
    <details class="ctx" id="pasteBox"><summary>Restaurer depuis du texte copié</summary>
      <textarea class="input mono" id="restoreText" placeholder="Colle ici la sauvegarde copiée" style="margin-top:8px"></textarea>
      <div class="foot" style="margin-top:10px"><button type="button" class="blk" data-act="restore-text">Restaurer</button></div>
    </details>
    <p class="help" style="margin-top:12px">Une restauration ajoute tes builds sans effacer les autres, et tu peux l'annuler juste après.</p>`);
}

function exportData() {
  const blob = new Blob([backupJSON()], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `carnet-builds-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Sauvegarde téléchargée");
}
async function copyBackup() {
  const text = backupJSON();
  try {
    await navigator.clipboard.writeText(text);
    toast("Sauvegarde copiée. Colle-la dans l'autre version.");
  } catch (e) {
    const box = $("#pasteBox"); if (box) box.open = true;
    const ta = $("#restoreText");
    if (ta) { ta.value = text; ta.focus(); ta.select(); }
    toast("Copie manuelle : sélectionne le texte et copie-le.");
  }
}
function importPayload(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { toast("Ce texte n'est pas une sauvegarde valide."); return; }
  const arr = Array.isArray(d) ? d : d && d.builds;
  if (!Array.isArray(arr) || !arr.length) { toast("Aucun build trouvé dans cette sauvegarde."); return; }
  const before = builds.map((b) => JSON.parse(JSON.stringify(b)));
  let added = 0, updated = 0;
  arr.map(normalize).forEach((b) => {
    const i = builds.findIndex((x) => x.id === b.id);
    if (i >= 0) { builds[i] = b; updated++; } else { builds.push(b); added++; }
  });
  persist();
  if (sheetOpen) goBack();
  renderList();
  toast(`${added} ajouté${added > 1 ? "s" : ""}, ${updated} mis à jour`, "Annuler", () => { builds = before; persist(); renderList(); toast("Restauration annulée"); });
}
$("#importFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try { importPayload(await file.text()); } catch (err) { toast("Impossible de lire ce fichier."); }
});

/* ===================== Evenements ===================== */
document.addEventListener("click", (e) => {
  const t = e.target;
  const open = t.closest("[data-open]");
  if (open) { showDetail(open.dataset.open); return; }
  const tab = t.closest("[data-tab]");
  if (tab) { st.tab = tab.dataset.tab; renderList(); return; }
  const clr = t.closest("[data-clear]");
  if (clr) { st.f[clr.dataset.clear] = ""; renderList(); return; }

  const el = t.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case "new": showForm(null); break;
    case "back": goBack(); break;
    case "edit": showForm(currentId); break;
    case "cancel-form": if (currentId && getBuild(currentId)) showDetail(currentId); else goBack(); break;
    case "save": saveForm(); break;
    case "delete": deleteCurrent(); break;
    case "status": {
      const b = getBuild(currentId); if (!b) break;
      b.status = el.dataset.s; persist();
      el.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === el)));
      break;
    }
    case "check": {
      const b = getBuild(currentId); if (!b) break;
      const m = b.materials.find((x) => x.id === el.dataset.mid); if (!m) break;
      m.done = !m.done; persist(); refreshMaterials(b);
      if (b.materials.length && b.materials.every((x) => x.done)) toast("Tout est réuni, à toi de jouer !");
      break;
    }
    case "uncheck-all": {
      const b = getBuild(currentId); if (!b) break;
      b.materials.forEach((m) => (m.done = false)); persist(); refreshMaterials(b);
      break;
    }
    case "pick": {
      draft[el.dataset.g] = el.dataset.v;
      el.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === el)));
      break;
    }
    case "theme": {
      const inp = $("#f-theme"); inp.value = el.dataset.v; syncThemeChips();
      break;
    }
    case "filter": {
      const k = el.dataset.k, v = el.dataset.v;
      st.f[k] = st.f[k] === v ? "" : v;
      refreshFilterSheet();
      break;
    }
    case "clear-filters": st.f = { theme: "", season: "", difficulty: "", edition: "" }; refreshFilterSheet(); break;
    case "reset-all": st.q = ""; $("#q").value = ""; st.tab = "Tous"; st.f = { theme: "", season: "", difficulty: "", edition: "" }; renderList(); break;
    case "close-sheet": goBack(); break;
    case "install": installFlow(); break;
    case "dismiss-banner": try { localStorage.setItem(DISMISS_KEY, "1"); } catch (err) {} renderBanner(); break;
    case "all-cats": {
      const box = $("#allCats"); box.hidden = !box.hidden;
      el.setAttribute("aria-expanded", String(!box.hidden));
      el.textContent = box.hidden ? "Voir toutes les catégories" : "Masquer les catégories";
      break;
    }
    case "remove-samples": builds = builds.filter((b) => !b.sample); persist(); goBack(); renderList(); toast("Exemples retirés"); break;
    case "add-samples": builds = builds.concat(sampleBuilds().filter((s) => !builds.some((b) => b.id === s.id))); persist(); goBack(); renderList(); toast("Exemples ajoutés"); break;
    case "themes": openThemes(); break;
    case "set-theme": setTheme(el.dataset.t); break;
    case "transfer": openTransfer(); break;
    case "copy-backup": copyBackup(); break;
    case "restore-text": importPayload(($("#restoreText") || {}).value || ""); break;
    case "export": exportData(); break;
    case "import": $("#importFile").click(); break;
  }
});

document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "q") { st.q = e.target.value; renderList(); }
  else if (id === "f-url") onUrlInput();
  else if (id === "f-theme") syncThemeChips();
  else if (id === "f-mat") countMaterials();
  else if (id === "f-title") { e.target.dataset.auto = "0"; const er = $("#e-title"); if (er) er.hidden = true; }
});

$("#btnFilters").addEventListener("click", openFilters);
$("#btnMenu").addEventListener("click", openMenu);
$("#btnTheme").addEventListener("click", openThemes);
$("#fab").addEventListener("click", () => showForm(null));

/* ===================== Démarrage ===================== */
$("#icSearch").innerHTML = I.search;
$("#btnMenu").innerHTML = I.dots;
$("#btnTheme").innerHTML = I.palette;
applyTheme();
try { localStorage.removeItem("carnet-ai-key"); } catch (e) { /* rien à nettoyer */ }
$("#fab").innerHTML = I.plus + "Ajouter";
load();
renderList();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
</script>
</body>
</html>
